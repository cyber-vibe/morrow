<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · morrow.</title><link rel="stylesheet" href="../shared.css"><link rel="stylesheet" href="settings.css"></head><body><main class="shell"><header class="top"><span class="brand">morrow.</span><span class="muted">Your rhythm, your way.</span></header><h1>Make it yours.</h1><p class="muted">Changes apply to future sessions. Your current countdown stays intact.</p><form id="form"><h2>Focus rhythm</h2><div class="grid"><label>Focus minutes<input id="focus" type="number" min="1" max="180" required></label><label>Short break minutes<input id="short" type="number" min="1" max="90" required></label><label>Long break minutes<input id="long" type="number" min="1" max="180" required></label><label>Sessions per cycle<input id="sessions" type="number" min="1" max="20" required></label><label>Long break every N sessions<input id="longEvery" type="number" min="1" max="20" required></label><label>Appearance<select id="theme"><option value="system">Follow system</option><option value="light">Caramel & ivory</option><option value="dark">Lavender & ocean</option></select></label></div><label class="toggle"><input id="auto" type="checkbox"> Automatically start the next focus session after a break</label><h2>Little escapes</h2><p class="muted">Choose which websites appear on your break page.</p><div id="sites"></div><button type="button" id="add" class="btn secondary">+ Add website</button><div class="bottom"><span id="message" role="status"></span><button class="btn" type="submit">Save preferences</button></div></form></main><script src="../shared.js"></script><script src="settings.js"></script></body></html>
